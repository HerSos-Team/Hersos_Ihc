<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Iniciar sesión — HerSOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles/styles.css" />
    <style>
      :root { --brand-700:#450062; --brand-500:#6A0DAD; --text:#2c2c2c; --muted:#6b6b6b; --border:#e9e9ef; }
      *{box-sizing:border-box; margin:0; padding:0;}
      body { 
        font-family: ui-sans-serif,system-ui,Segoe UI,Inter,Arial; 
        background: #f5f5f5;
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 80px 0;
      }
      
      /* Fondo con imagen animada */
      .auth-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: hidden;
      }
      
      .auth-background::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('assets/images/fondo.avif');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        animation: slowZoom 20s ease-in-out infinite alternate;
        filter: brightness(0.7);
      }
      
      .auth-background::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, rgba(69,0,98,0.92) 0%, rgba(106,13,173,0.88) 100%);
      }
      
      @keyframes slowZoom {
        0% { transform: scale(1); }
        100% { transform: scale(1.05); }
      }
      
      /* Contenedor del formulario */
      .auth-shell { 
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 480px;
        padding: 24px;
      }
      
      .auth-back { 
        position: fixed;
        top: 24px;
        left: 24px;
        font-size: 0.95rem;
        color: rgba(255,255,255,0.9);
        z-index: 100;
        font-weight: 600;
        transition: all 0.2s;
      }
      
      .auth-back:hover {
        color: #fff;
        transform: translateX(-4px);
      }
      
      .auth-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 56px 48px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        border: none;
      }
      
      .auth-title { 
        font-family: 'Poppins', sans-serif;
        font-size: 2.5rem;
        line-height: 1.2;
        margin: 0 0 12px;
        color: #450062;
        font-weight: 800;
        text-align: center;
      }
      
      .auth-desc { 
        color: var(--muted);
        margin: 0 0 32px;
        text-align: center;
        font-size: 1rem;
      }
      
      .auth-form { display: flex; flex-direction: column; gap: 20px; }
      
      .field { display: flex; flex-direction: column; gap: 8px; }
      .field label { font-weight: 700; color: #333; font-size: 0.95rem; }
      .field input { 
        width: 100%;
        padding: 14px 16px;
        border: 2px solid var(--border);
        border-radius: 12px;
        font-size: 1rem;
        background: #fff;
        color: #1f2430;
        transition: all 0.2s;
      }
      
      .field input:focus { 
        outline: none;
        border-color: var(--brand-500);
        box-shadow: 0 0 0 4px rgba(106,13,173,0.12);
      }
      
      .row { 
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        font-size: 0.9rem;
      }
      
      .row .remember { 
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }
      
      .row a {
        color: var(--brand-700);
        font-weight: 600;
      }
      
      .btn-submit { 
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 12px;
        color: #fff;
        font-weight: 800;
        font-size: 1.05rem;
        cursor: pointer;
        background: linear-gradient(135deg, var(--brand-500), var(--brand-700));
        box-shadow: 0 8px 26px rgba(69,0,98,0.3);
        transition: all 0.3s;
      }
      
      .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 36px rgba(69,0,98,0.4);
      }
      
      .divider { 
        text-align: center;
        color: var(--muted);
        position: relative;
        margin: 24px 0 20px;
        font-size: 0.9rem;
      }
      
      .divider::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 1px;
        background: #ddd;
      }
      
      .divider span { 
        background: #ffffff;
        padding: 0 16px;
        position: relative;
      }
      
      .socials { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      
      .btn-social { 
        padding: 12px;
        border: 2px solid var(--border);
        border-radius: 10px;
        background: #fff;
        font-weight: 700;
        color: #333;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.95rem;
      }
      
      .btn-social:hover {
        border-color: var(--brand-500);
        transform: translateY(-2px);
      }
      
      .auth-meta { 
        margin-top: 20px;
        color: var(--muted);
        font-size: 0.95rem;
        text-align: center;
      }
      
      .auth-meta a { 
        font-weight: 800;
        color: var(--brand-700);
      }
      
      @media (max-width: 600px) {
        .auth-card { padding: 32px 24px; }
        .auth-title { font-size: 2rem; }
        .auth-back { top: 16px; left: 16px; }
      }
    </style>
  </head>
  <body>
    <div class="auth-background"></div>
    
    <a class="auth-back" href="index.html">← Volver al inicio</a>
    
    <div class="auth-shell">
      <div class="auth-card">
        <h1 class="auth-title">Bienvenida</h1>
        <p class="auth-desc">Inicia sesión en tu espacio seguro</p>

        <form id="loginForm" class="auth-form">
          <div class="field">
            <label for="email">Correo Electrónico</label>
            <input id="email" name="email" type="email" required placeholder="tu@email.com" autocomplete="email" />
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" required placeholder="••••••••" autocomplete="current-password" />
          </div>
          <div class="row">
            <label class="remember"><input type="checkbox" /> Recordarme</label>
            <a href="#">¿Olvidaste tu contraseña?</a>
          </div>
          <button id="submitBtn" class="btn-submit" type="submit">Iniciar Sesión →</button>

          <div class="divider"><span>o continúa con</span></div>
          <div class="socials">
            <button type="button" class="btn-social btn-google">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
                <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.96v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
                <path d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z" fill="#FBBC05"/>
                <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.96 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
              </svg>
              Google
            </button>
            <button type="button" class="btn-social btn-facebook">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 9C18 4.03125 13.9688 0 9 0C4.03125 0 0 4.03125 0 9C0 13.4062 3.15625 17.0938 7.3125 17.8125V11.25H5.0625V9H7.3125V7.03125C7.3125 4.78125 8.59375 3.65625 10.6562 3.65625C11.6562 3.65625 12.6562 3.84375 12.6562 3.84375V6.09375H11.5625C10.4688 6.09375 10.125 6.75 10.125 7.40625V9H12.5625L12.1875 11.25H10.125V17.8125C14.2812 17.0938 18 13.4062 18 9Z" fill="#1877F2"/>
              </svg>
              Facebook
            </button>
          </div>
        </form>

        <p class="auth-meta">¿No tienes cuenta? <a href="registro.html">Regístrate gratis</a></p>
      </div>
    </div>

    <script src="assets/scripts/login.js"></script>
  </body>
</html>
