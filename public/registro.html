<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Crear cuenta — HerSOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles/styles.css" />
    <style>
      :root { --brand-700:#450062; --brand-500:#6A0DAD; --text:#2c2c2c; --muted:#6b6b6b; --border:#e9e9ef; }
      *{box-sizing:border-box; margin:0; padding:0;}
      body { 
        font-family: ui-sans-serif,system-ui,Segoe UI,Inter,Arial; 
        background: #f5f5f5;
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 80px 0;
      }
      
      .auth-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: hidden;
      }
      
      .auth-background::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('assets/images/fondo.avif');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        animation: slowZoom 20s ease-in-out infinite alternate;
        filter: brightness(0.7);
      }
      
      .auth-background::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, rgba(69,0,98,0.92) 0%, rgba(106,13,173,0.88) 100%);
      }
      
      @keyframes slowZoom {
        0% { transform: scale(1); }
        100% { transform: scale(1.05); }
      }
      
      .auth-shell { 
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 480px;
        padding: 24px;
      }
      
      .auth-back { 
        position: fixed;
        top: 24px;
        left: 24px;
        font-size: 0.95rem;
        color: rgba(255,255,255,0.9);
        z-index: 100;
        font-weight: 600;
        transition: all 0.2s;
      }
      
      .auth-back:hover {
        color: #fff;
        transform: translateX(-4px);
      }
      
      .auth-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 56px 48px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        border: none;
      }
      
      .auth-title { 
        font-family: 'Poppins', sans-serif;
        font-size: 2.5rem;
        line-height: 1.2;
        margin: 0 0 12px;
        color: #450062;
        font-weight: 800;
        text-align: center;
      }
      
      .auth-desc { 
        color: var(--muted);
        margin: 0 0 32px;
        text-align: center;
        font-size: 1rem;
      }
      
      .auth-form { display: flex; flex-direction: column; gap: 20px; }
      
      .field { display: flex; flex-direction: column; gap: 8px; }
      .field label { font-weight: 700; color: #333; font-size: 0.95rem; }
      .field input, .field select { 
        width: 100%;
        padding: 14px 16px;
        border: 2px solid var(--border);
        border-radius: 12px;
        font-size: 1rem;
        background: #fff;
        color: #1f2430;
        transition: all 0.2s;
      }
      
      .field input:focus, .field select:focus { 
        outline: none;
        border-color: var(--brand-500);
        box-shadow: 0 0 0 4px rgba(106,13,173,0.12);
      }
      
      .btn-submit { 
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 12px;
        color: #fff;
        font-weight: 800;
        font-size: 1.05rem;
        cursor: pointer;
        background: linear-gradient(135deg, var(--brand-500), var(--brand-700));
        box-shadow: 0 8px 26px rgba(69,0,98,0.3);
        transition: all 0.3s;
      }
      
      .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 36px rgba(69,0,98,0.4);
      }
      
      .divider { 
        text-align: center;
        color: var(--muted);
        position: relative;
        margin: 24px 0 20px;
        font-size: 0.9rem;
      }
      
      .divider::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 1px;
        background: #ddd;
      }
      
      .divider span { 
        background: #ffffff;
        padding: 0 16px;
        position: relative;
      }
      
      .socials { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      
      .btn-social { 
        padding: 12px;
        border: 2px solid var(--border);
        border-radius: 10px;
        background: #fff;
        font-weight: 700;
        color: #333;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.95rem;
      }
      
      .btn-social:hover {
        border-color: var(--brand-500);
        transform: translateY(-2px);
      }
      
      .auth-meta { 
        margin-top: 20px;
        color: var(--muted);
        font-size: 0.95rem;
        text-align: center;
      }
      
      .auth-meta a { 
        font-weight: 800;
        color: var(--brand-700);
      }
      
      @media (max-width: 600px) {
        .auth-card { padding: 32px 24px; }
        .auth-title { font-size: 2rem; }
        .auth-back { top: 16px; left: 16px; }
      }
    </style>
  </head>
  <body>
    <div class="auth-background"></div>
    
    <a class="auth-back" href="index.html">← Volver al inicio</a>
    
    <div class="auth-shell">
      <div class="auth-card">
        <h1 class="auth-title">Crea tu Cuenta</h1>
        <p class="auth-desc">Unéte a nuestra comunidad segura</p>

        <form id="registerForm" class="auth-form">
          <div class="field">
            <label for="rname">Nombre completo</label>
            <input id="rname" name="name" type="text" required placeholder="Tu nombre" />
          </div>
          <div class="field">
            <label for="remail">Correo Electrónico</label>
            <input id="remail" name="email" type="email" required placeholder="tu@email.com" />
          </div>
          <div class="field">
            <label for="rpass">Contraseña</label>
            <input id="rpass" name="password" type="password" required placeholder="••••••••" />
          </div>
          <button id="rsubmit" class="btn-submit" type="submit">Crear cuenta →</button>

          <div class="divider"><span>o continúa con</span></div>
          <div class="socials">
            <button type="button" class="btn-social btn-google">Google</button>
            <button type="button" class="btn-social btn-facebook">Facebook</button>
          </div>
        </form>

        <p class="auth-meta">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
      </div>
    </div>

    <script src="assets/scripts/login.js"></script>
  </body>
</html>
